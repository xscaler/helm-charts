name: xs-charts
# xScaler chart pipeline for loki and tempo-distributed. Lint and template on
# every push and pull request. Pushes to main publish to
# oci://ghcr.io/xscaler/charts (release). Pushes to ci/** run the same
# publish path against oci://ghcr.io/xscaler/rehearsal/charts with a
# rehearsal version (rehearsal). Upstream workflows stay untouched.
permissions: {}

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xs-charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_YAMALE: '6.1.0'
  PYTHON_YAMLLINT: '1.38.0'

jobs:
  lint:
    name: Lint and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install pinned tools
        id: tools
        uses: ./.github/actions/xs-tools

      - name: Install ct python dependencies
        run: pip install "yamale==$PYTHON_YAMALE" "yamllint==$PYTHON_YAMLLINT"

      # ct.yaml (upstream) runs ci/lint.sh and `helm unittest --strict` as additional commands.
      # The version bump check compares against main, which is meaningless for a fork that
      # carries the bump itself, so it is off.
      - name: ct lint
        env:
          CT_ETC: ${{ steps.tools.outputs.ct-etc }}
        run: |
          ct lint \
            --config .github/linters/ct.yaml \
            --charts charts/loki,charts/tempo-distributed \
            --check-version-increment=false \
            --chart-yaml-schema "$CT_ETC/chart_schema.yaml" \
            --lint-conf "$CT_ETC/lintconf.yaml"

  template:
    name: Template (${{ matrix.chart }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: loki
            engine: loki
          - chart: tempo-distributed
            engine: tempo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: ./.github/actions/xs-tools

      - name: helm dependency update
        env:
          CHART: ${{ matrix.chart }}
        run: helm dependency update "charts/$CHART"

      - name: helm lint
        env:
          CHART: ${{ matrix.chart }}
        run: |
          helm lint "charts/$CHART"
          for f in "charts/$CHART"/ci/*-values.yaml; do
            [ -f "$f" ] || continue
            helm lint "charts/$CHART" --values "$f"
          done

      # Renders the chart with every ci/*-values.yaml (the defaults need storage settings), then checks that
      # the engine image comes from ghcr.io/xscaler and no upstream engine image is left.
      - name: helm template and image check
        env:
          CHART: ${{ matrix.chart }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          status=0
          APP_VERSION="$(helm show chart "charts/$CHART" | sed -n 's/^appVersion: *//p' | tr -d '"')"
          files=()
          for f in "charts/$CHART"/ci/*-values.yaml; do
            [ -f "$f" ] && files+=("$f")
          done
          # Charts without ci values are rendered with their defaults.
          [ "${#files[@]}" -gt 0 ] || files=("")
          for f in "${files[@]}"; do
            args=()
            [ -n "$f" ] && args=(--values "$f")
            echo "::group::helm template $CHART ${f:-defaults}"
            if ! helm template "$CHART" "charts/$CHART" --namespace xs "${args[@]}" > rendered.yaml; then
              echo "::error::helm template failed for $CHART ${f:-defaults}"
              status=1
              echo "::endgroup::"
              continue
            fi
            if grep -E "^\s*-?\s*image:.*grafana/${ENGINE}([:@\"' ]|$)" rendered.yaml; then
              echo "::error::upstream grafana/${ENGINE} image rendered for $CHART ${f:-defaults}"
              status=1
            fi
            if ! grep -Eq "image:.*ghcr\.io/xscaler/${ENGINE}:" rendered.yaml; then
              echo "::error::no ghcr.io/xscaler/${ENGINE} image rendered for $CHART ${f:-defaults}"
              status=1
            fi
            grep -E "^\s*-?\s*image:.*/${ENGINE}[:@]" rendered.yaml | sort -u
            # Engine tags must be the chart appVersion or its -xs build, so a stale tag after an upstream rebase fails here.
            while read -r tag; do
              if [[ "$tag" != "$APP_VERSION" && "$tag" != "$APP_VERSION"-xs.* ]]; then
                echo "::error::engine image tag $tag does not match appVersion $APP_VERSION (${f:-defaults})"
                status=1
              fi
            done < <(grep -oE "ghcr\.io/xscaler/${ENGINE}:[^\"' ]+" rendered.yaml | sort -u | sed 's/^[^:]*://')
            echo "::endgroup::"
          done
          exit "$status"

  publish:
    name: Publish ${{ matrix.chart }}
    needs: [lint, template]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || 'rehearsal' }}
    concurrency:
      group: xs-charts-publish-${{ github.ref == 'refs/heads/main' && 'release' || 'rehearsal' }}-${{ matrix.chart }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: loki
            engine: loki
          - chart: tempo-distributed
            engine: tempo
    env:
      CHART: ${{ matrix.chart }}
      ENGINE: ${{ matrix.engine }}
      CERT_ISSUER: https://token.actions.githubusercontent.com
      WORKFLOW_REF: ${{ github.ref }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: ./.github/actions/xs-tools

      # release: main pushes publish the chart version to oci://ghcr.io/xscaler/charts.
      # rehearsal: ci/** pushes publish <version>+rehearsal.<shortsha> to oci://ghcr.io/xscaler/rehearsal/charts.
      # Helm stores the chart version with "+" replaced by "_" as the OCI tag.
      - name: Resolve target
        id: meta
        run: |
          set -euo pipefail
          chart_version="$(helm show chart "charts/$CHART" | sed -n 's/^version: *//p' | tr -d '"')"
          if [ "$WORKFLOW_REF" = "refs/heads/main" ]; then
            mode=release
            repo="ghcr.io/xscaler/charts"
            version="$chart_version"
          else
            mode=rehearsal
            repo="ghcr.io/xscaler/rehearsal/charts"
            version="${chart_version%%+*}+rehearsal.${EVENT_SHA:0:7}"
          fi
          {
            echo "mode=$mode"
            echo "repo=$repo"
            echo "version=$version"
            echo "tag=${version//+/_}"
            echo "identity=https://github.com/xscaler/helm-charts/.github/workflows/xs-charts.yml@${WORKFLOW_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "$mode: $repo/$CHART $version"

      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | crane auth login ghcr.io --username "$REGISTRY_USER" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: helm dependency update
        run: helm dependency update "charts/$CHART"

      # Every ghcr.io/xscaler/<engine> image any ci values file renders must exist, so a chart never
      # points at a missing image. Rehearsal only warns: it runs before the engine images are released.
      - name: Check the engine images exist
        env:
          MODE: ${{ steps.meta.outputs.mode }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/engine-images.txt"
          for f in "charts/$CHART"/ci/*-values.yaml; do
            [ -f "$f" ] || continue
            helm template "$CHART" "charts/$CHART" --values "$f" \
              | grep -oE "ghcr\.io/xscaler/${ENGINE}[:@][^\"' ]+" >> "$RUNNER_TEMP/engine-images.txt" || true
          done
          sort -u -o "$RUNNER_TEMP/engine-images.txt" "$RUNNER_TEMP/engine-images.txt"
          test -s "$RUNNER_TEMP/engine-images.txt" || { echo "::error::chart renders no ghcr.io/xscaler/$ENGINE image"; exit 1; }
          while read -r ref; do
            if crane manifest "$ref" > /dev/null 2>&1; then
              echo "found $ref"
            elif [ "$MODE" = "rehearsal" ]; then
              echo "::warning::engine image $ref is not published yet (tolerated in rehearsal)"
            else
              echo "::error::engine image $ref is not published. Release it from the engine repository before publishing this chart."
              exit 1
            fi
          done < "$RUNNER_TEMP/engine-images.txt"

      # Absent means MANIFEST_UNKNOWN or NAME_UNKNOWN only. Denied or unauthorized is an error.
      - name: Check whether the version exists
        id: exists
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          out="$(crane manifest "$REPO/$CHART:$TAG" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out"
            echo "::error::could not check $REPO/$CHART:$TAG (denied, unauthorized or network error). Check the token permissions and package access."
            exit 1
          fi

      # A published version is immutable. If it exists, the local chart must render the same manifests.
      - name: Compare with the published chart
        if: steps.exists.outputs.exists == 'true'
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          helm pull "oci://$REPO/$CHART" --version "$VERSION" --untar --untardir "$RUNNER_TEMP/published"
          # Package the local chart under the published version so the chart labels compare equal.
          helm package "charts/$CHART" --version "$VERSION" --destination "$RUNNER_TEMP/localpkg" > /dev/null
          mkdir -p "$RUNNER_TEMP/local"
          tar -xzf "$RUNNER_TEMP/localpkg/$CHART-${VERSION}.tgz" -C "$RUNNER_TEMP/local"
          status=0
          files=("")
          for f in "charts/$CHART"/ci/*-values.yaml; do
            [ -f "$f" ] && files+=("$f")
          done
          for f in "${files[@]}"; do
            args=()
            [ -n "$f" ] && args=(--values "$f")
            helm template "$CHART" "$RUNNER_TEMP/published/$CHART" "${args[@]}" > "$RUNNER_TEMP/remote.yaml" 2> "$RUNNER_TEMP/remote.err" || true
            helm template "$CHART" "$RUNNER_TEMP/local/$CHART" "${args[@]}" > "$RUNNER_TEMP/local.yaml" 2> "$RUNNER_TEMP/local.err" || true
            if ! diff -u "$RUNNER_TEMP/remote.yaml" "$RUNNER_TEMP/local.yaml" > "$RUNNER_TEMP/render.diff" \
                || ! diff -u "$RUNNER_TEMP/remote.err" "$RUNNER_TEMP/local.err" >> "$RUNNER_TEMP/render.diff"; then
              head -n 40 "$RUNNER_TEMP/render.diff"
              echo "::error::published $CHART $VERSION differs from the local chart (${f:-defaults}). Bump the chart version."
              status=1
            fi
          done
          exit "$status"

      - name: Package and push
        if: steps.exists.outputs.exists == 'false'
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          helm package "charts/$CHART" --version "$VERSION" --destination "$RUNNER_TEMP/pkg"
          helm push "$RUNNER_TEMP/pkg/$CHART-${VERSION}.tgz" "oci://$REPO"

      # Sign what the registry holds, not what this run pushed. Only "no signatures found" means unsigned;
      # any other verify failure, including a signature from another identity, fails the job.
      - name: Sign and verify
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IDENTITY: ${{ steps.meta.outputs.identity }}
        run: |
          set -euo pipefail
          digest="$(crane digest "$REPO/$CHART:$TAG")"
          ref="$REPO/$CHART@$digest"
          verify() {
            cosign verify "$ref" --certificate-oidc-issuer "$CERT_ISSUER" --certificate-identity "$IDENTITY"
          }
          set +e
          out="$(verify 2>&1 > /dev/null)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if ! printf '%s' "$out" | grep -q 'no signatures found'; then
              printf '%s\n' "$out"
              echo "::error::cosign verify failed for $ref"
              exit 1
            fi
            cosign sign --yes "$ref"
            verify > /dev/null
          fi
          echo "$ref is signed by $IDENTITY"
          mkdir -p "$RUNNER_TEMP/final"
          helm pull "oci://$REPO/$CHART" --version "$VERSION" --destination "$RUNNER_TEMP/final"
          echo "pulled $CHART $VERSION"

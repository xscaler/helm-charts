name: xs-charts
# xScaler chart pipeline for loki and tempo-distributed. Lint and template on
# every push and pull request, publish to GHCR and ECR from main when the
# chart version is not in the registry yet. Upstream workflows stay untouched.
permissions: {}

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

concurrency:
  group: xs-charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GHCR_REGISTRY: ghcr.io/xscaler/charts
  ECR_HOST: 483075907540.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REGISTRY: 483075907540.dkr.ecr.eu-west-1.amazonaws.com/xscaler/charts
  AWS_REGION: eu-west-1
  HELM_VERSION: v4.3.1
  CT_VERSION: v3.15.0
  HELM_UNITTEST_VERSION: 1.2.1
  HELM_SCHEMA_VERSION: 2.6.0
  CRANE_VERSION: v0.22.1

jobs:
  lint:
    name: Lint and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CT_VERSION }}

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION" --verify=false

      - name: Install helm values-schema plugin
        run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --version "$HELM_SCHEMA_VERSION" --verify=false

      # ct.yaml (upstream) runs ci/lint.sh and `helm unittest --strict` as additional commands.
      # The version bump check compares against main, which is meaningless for a fork that
      # carries the bump itself, so it is off.
      - name: ct lint
        run: |
          ct lint \
            --config .github/linters/ct.yaml \
            --charts charts/loki,charts/tempo-distributed \
            --check-version-increment=false

  template:
    name: Template (${{ matrix.chart }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: loki
            engine: loki
          - chart: tempo-distributed
            engine: tempo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm dependency update
        env:
          CHART: ${{ matrix.chart }}
        run: helm dependency update "charts/$CHART"

      - name: helm lint
        env:
          CHART: ${{ matrix.chart }}
        run: |
          helm lint "charts/$CHART"
          for f in "charts/$CHART"/ci/*-values.yaml; do
            [ -f "$f" ] || continue
            helm lint "charts/$CHART" --values "$f"
          done

      # Renders the chart with every ci/*-values.yaml (the defaults need storage settings), then checks that
      # the engine image comes from ghcr.io/xscaler and no upstream engine image is left.
      - name: helm template and image check
        env:
          CHART: ${{ matrix.chart }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          status=0
          APP_VERSION="$(helm show chart "charts/$CHART" | sed -n 's/^appVersion: *//p' | tr -d '"')"
          files=()
          for f in "charts/$CHART"/ci/*-values.yaml; do
            [ -f "$f" ] && files+=("$f")
          done
          # Charts without ci values are rendered with their defaults.
          [ "${#files[@]}" -gt 0 ] || files=("")
          for f in "${files[@]}"; do
            args=()
            [ -n "$f" ] && args=(--values "$f")
            echo "::group::helm template $CHART ${f:-defaults}"
            if ! helm template "$CHART" "charts/$CHART" --namespace xs "${args[@]}" > rendered.yaml; then
              echo "::error::helm template failed for $CHART ${f:-defaults}"
              status=1
              echo "::endgroup::"
              continue
            fi
            if grep -E "^\s*-?\s*image:.*grafana/${ENGINE}([:@\"' ]|$)" rendered.yaml; then
              echo "::error::upstream grafana/${ENGINE} image rendered for $CHART ${f:-defaults}"
              status=1
            fi
            if ! grep -Eq "image:.*ghcr\.io/xscaler/${ENGINE}:" rendered.yaml; then
              echo "::error::no ghcr.io/xscaler/${ENGINE} image rendered for $CHART ${f:-defaults}"
              status=1
            fi
            grep -E "^\s*-?\s*image:.*/${ENGINE}[:@]" rendered.yaml | sort -u
            # Engine tags must be the chart appVersion or its -xs build, so a stale tag after an upstream rebase fails here.
            while read -r tag; do
              if [[ "$tag" != "$APP_VERSION" && "$tag" != "$APP_VERSION"-xs.* ]]; then
                echo "::error::engine image tag $tag does not match appVersion $APP_VERSION (${f:-defaults})"
                status=1
              fi
            done < <(grep -oE "ghcr\.io/xscaler/${ENGINE}:[^\"' ]+" rendered.yaml | sort -u | sed 's/^[^:]*://')
            echo "::endgroup::"
          done
          exit "$status"

  publish:
    name: Publish ${{ matrix.chart }}
    needs: [lint, template]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: xs-charts-publish-${{ matrix.chart }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: loki
            engine: loki
          - chart: tempo-distributed
            engine: tempo
    env:
      CHART: ${{ matrix.chart }}
      ENGINE: ${{ matrix.engine }}
      CERT_IDENTITY: '^https://github\.com/xscaler/helm-charts/\.github/workflows/xs-charts\.yml@refs/heads/main$'
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: ${{ env.CRANE_VERSION }}

      # Helm stores the chart version with "+" replaced by "_" as the OCI tag.
      - name: Resolve chart version and engine image
        id: meta
        run: |
          set -euo pipefail
          version="$(helm show chart "charts/$CHART" | sed -n 's/^version: *//p' | tr -d '"')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version//+/_}" >> "$GITHUB_OUTPUT"
          helm dependency update "charts/$CHART" > /dev/null
          values="$(ls "charts/$CHART"/ci/*-values.yaml | head -n1)"
          helm template "$CHART" "charts/$CHART" --values "$values" \
            | grep -oE "ghcr\.io/xscaler/${ENGINE}:[^\"' ]+" | sort -u > "$RUNNER_TEMP/engine-images.txt"
          test -s "$RUNNER_TEMP/engine-images.txt" || { echo "::error::chart renders no ghcr.io/xscaler/$ENGINE image"; exit 1; }
          cat "$RUNNER_TEMP/engine-images.txt"

      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | crane auth login ghcr.io --username "$REGISTRY_USER" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Check the engine image exists
        run: |
          set -euo pipefail
          while read -r ref; do
            if ! crane manifest "$ref" > /dev/null; then
              echo "::error::engine image $ref is not published. Release it from the engine repository before publishing this chart."
              exit 1
            fi
            echo "found $ref"
          done < "$RUNNER_TEMP/engine-images.txt"

      - name: Push to GHCR if missing
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          out="$(crane manifest "$GHCR_REGISTRY/$CHART:$TAG" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "$CHART $VERSION is already in GHCR"
            exit 0
          fi
          # A missing package answers 404, MANIFEST_UNKNOWN, NAME_UNKNOWN or denied (login succeeded above).
          if ! printf '%s' "$out" | grep -Eqi 'not found|404|manifest_unknown|name_unknown|name unknown|denied|unauthorized'; then
            printf '%s\n' "$out"
            echo "::error::could not check GHCR for $CHART $VERSION"
            exit 1
          fi
          helm dependency update "charts/$CHART"
          helm package "charts/$CHART" --destination "$RUNNER_TEMP/pkg"
          helm push "$RUNNER_TEMP/pkg/$CHART-${VERSION}.tgz" "oci://$GHCR_REGISTRY"

      # Sign what the registry holds, not what this run pushed, so a failed earlier run is repaired.
      - name: Sign and verify in GHCR
        id: ghcr
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$(crane digest "$GHCR_REGISTRY/$CHART:$TAG")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          ref="$GHCR_REGISTRY/$CHART@$digest"
          set +e
          out="$(cosign verify "$ref" --certificate-oidc-issuer "$CERT_ISSUER" --certificate-identity-regexp "$CERT_IDENTITY" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if ! printf '%s' "$out" | grep -Eqi 'no signatures found|no matching signatures'; then
              printf '%s\n' "$out"
              echo "::error::cosign verify failed for $ref for a reason other than a missing signature"
              exit 1
            fi
            cosign sign --yes "$ref"
            cosign verify "$ref" --certificate-oidc-issuer "$CERT_ISSUER" --certificate-identity-regexp "$CERT_IDENTITY" > /dev/null
          fi
          echo "$ref is signed"

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_OPS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Explain AWS credential failure
        if: failure() && steps.aws.outcome == 'failure'
        run: |
          echo "::error title=ECR publish blocked::Could not assume the ECR push role. The role, its trust for repo:xscaler/helm-charts:ref:refs/heads/main and the ECR repositories xscaler/charts/loki and xscaler/charts/tempo-distributed come from the pending terraform change. Apply it and re-run this workflow."

      - name: Log in to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" > "$RUNNER_TEMP/ecr-password"
          crane auth login "$ECR_HOST" --username AWS --password-stdin < "$RUNNER_TEMP/ecr-password"
          cosign login "$ECR_HOST" --username AWS --password-stdin < "$RUNNER_TEMP/ecr-password"
          rm -f "$RUNNER_TEMP/ecr-password"

      - name: Copy to ECR, sign and verify
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SRC_DIGEST: ${{ steps.ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          set +e
          out="$(crane digest "$ECR_REGISTRY/$CHART:$TAG" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            if [ "$out" != "$SRC_DIGEST" ]; then
              echo "::error::ECR $CHART:$TAG has digest $out but GHCR has $SRC_DIGEST (ECR tags are immutable)"
              exit 1
            fi
          elif printf '%s' "$out" | grep -Eqi 'not found|404|manifest_unknown|name_unknown|name unknown|repositorynotfound'; then
            crane copy "$GHCR_REGISTRY/$CHART@$SRC_DIGEST" "$ECR_REGISTRY/$CHART:$TAG"
          else
            printf '%s\n' "$out"
            echo "::error::could not check ECR for $CHART:$TAG"
            exit 1
          fi
          ref="$ECR_REGISTRY/$CHART@$SRC_DIGEST"
          set +e
          out="$(cosign verify "$ref" --certificate-oidc-issuer "$CERT_ISSUER" --certificate-identity-regexp "$CERT_IDENTITY" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if ! printf '%s' "$out" | grep -Eqi 'no signatures found|no matching signatures'; then
              printf '%s\n' "$out"
              echo "::error::cosign verify failed for $ref for a reason other than a missing signature"
              exit 1
            fi
            cosign sign --yes "$ref"
            cosign verify "$ref" --certificate-oidc-issuer "$CERT_ISSUER" --certificate-identity-regexp "$CERT_IDENTITY" > /dev/null
          fi
          echo "$ref is signed"

# xScaler fork: keep the engine charts within one release of upstream.
#
# This repository has no release tags of its own. main is an upstream main commit,
# plus charts/loki and charts/tempo-distributed pinned to one upstream chart tag each
# (loki-<ver>, tempo-distributed-<ver>), plus our patch set.
#
# Live runs (schedule, or workflow_dispatch on main):
#   mirror      push upstream main (as upstream/main) and new upstream tags to origin.
#               Never pushes main, never touches *-xs.* tags.
#   detect      per chart: current = the chart tag main is on (Chart.yaml version
#               without +xs.N), target = the newest stable chart tag above it whose
#               appVersion has a released engine image
#               ghcr.io/xscaler/<engine>:<appVersion>-xs.N, cosign verified with the
#               engine release identity. A chart without a released engine stays where
#               it is and the run summary says so. Proceeds when a chart has a target and
#               no sync PR for that set of targets is open. A chart with no newer tag
#               but a newer verified engine build for its own appVersion is rebuilt:
#               same chart tag, version <ver>+xs.<m+1>, new engine tag.
#   sync        closes stale sync/* PRs, builds the tree (upstream main, each chart at
#               its target tag plus our chart patch, version <ver>+xs.0, engine tag
#               <appVersion>-xs.N) and opens a PR from sync/<tag>[_<tag>]. The commit is
#               created through the git data API, so GitHub signs it (Verified) and no
#               job pushes with git. A patch that does not apply opens a
#               "sync: <head> conflicts" issue.
#   report      opens or updates a "sync: failed" issue when a job fails.
#
# Rehearsal runs (push to ci/**): the mirror prints what it would push, and the sync
# logic runs against an artificial base (older chart tags plus our patch set, written to
# a dangling commit) with the engine lookup mocked as "released": the clean, upstream
# and merge runs must reproduce this branch's tree exactly on a rehearsal-sync/ branch,
# the conflict run must open an issue (labelled rehearsal, closed afterwards) and no
# branch, the nothing run must find nothing to do, and the rebuild run (a newer engine
# build of the same appVersion) must produce the same chart tags at +xs.1. All clean up
# after themselves.
#
# The logic lives in .github/scripts/xs-sync.sh. Its parameter block is the only
# part that changes between repositories; this file is repository neutral.
#
# Upstream workflows: all stay disabled. The mirror pushes upstream main, and a new upstream
# workflow file can run once (on the push of the sync branch, which carries upstream's
# files) before the disable-upstream-workflows job of the next daily run switches it off.
# Each sync PR body lists the upstream changes under .github.
#
# An open bot-owned sync PR is refreshed when main moved (the branch is rebuilt, only while
# its tip is still the bot's own commit); otherwise the PR gets a comment that it needs a
# manual update. A sync PR that was closed without merging is skipped, not re-opened.
#
# Namespace: upstream never owns xs-* workflows, scripts or actions. build fails when
# upstream main carries such a path or the result would change main's; the mirror still
# copies upstream refs but fails the run when upstream main or a new tag holds one; an
# xs-* workflow that upstream main or main's upstream base also has is disabled like any
# upstream one.
#
# An upstream refresh PR closed without merging is skipped for that upstream main tip
# (the PR body carries it as an xs-sync:upstream marker), not only for that day.
#
# Sync PRs must be merged with a merge commit: the next sync derives the upstream main
# commit main is built on from main's history.
name: xs-sync

on:
  schedule:
    - cron: "52 4 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - "ci/**"

permissions: {}

concurrency:
  group: xs-sync-${{ github.ref == 'refs/heads/main' && 'live' || format('rehearsal-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Resolve mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mode=none
          if [[ ("${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch") && "${REF}" == "refs/heads/main" ]]; then
            mode=live
          elif [[ ("${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch") && "${REF}" == refs/heads/ci/* ]]; then
            mode=rehearsal
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "mode: ${mode} (${EVENT_NAME} on ${REF})"

  mirror:
    name: mirror upstream
    needs: plan
    if: needs.plan.outputs.mode == 'live' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${REF}" == "refs/heads/main" && ("${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch") ]] || {
            echo "::error::live sync runs only from main on schedule or dispatch"
            exit 1
          }

      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.XS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.XS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: xscaler
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write # upstream branches and tags carry workflow files

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror
        env:
          XS_PUSH_TOKEN: ${{ steps.app.outputs.token }}
        run: .github/scripts/xs-sync.sh mirror

  mirror-dry-run:
    name: mirror dry run
    needs: plan
    if: needs.plan.outputs.mode == 'rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Print what would be pushed
        run: .github/scripts/xs-sync.sh mirror --dry-run

  detect:
    name: detect new release
    needs: [plan, mirror]
    # Runs after a failed mirror too: detect reads origin's tags as they are, and a
    # transient mirror failure must not stop a release that is already mirrored.
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'live' && (needs.mirror.result == 'success' || needs.mirror.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # list open sync PRs
      packages: read # engine package lookup and registry login
    outputs:
      head: ${{ steps.detect.outputs.head }}
      bumps: ${{ steps.detect.outputs.bumps }}
      proceed: ${{ steps.detect.outputs.proceed }}
      supersede: ${{ steps.detect.outputs.supersede }}
      upstream_commit: ${{ steps.detect.outputs.upstream_commit }}
      drift: ${{ steps.detect.outputs.drift }}
      open_pr: ${{ steps.detect.outputs.open_pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install crane and cosign
        run: |
          set -euo pipefail
          .github/scripts/xs-install-tool.sh crane
          .github/scripts/xs-install-tool.sh cosign

      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          .github/scripts/xs-sync.sh ghcr-login
          heads="${RUNNER_TEMP}/open-heads"
          .github/scripts/xs-sync.sh open-heads "${heads}"
          .github/scripts/xs-sync.sh detect --base origin/main --open-heads "${heads}"

  sync:
    name: build sync PR
    needs: [plan, detect]
    if: needs.plan.outputs.mode == 'live' && github.ref == 'refs/heads/main' && (needs.detect.outputs.proceed == 'true' || needs.detect.outputs.open_pr == 'true' || needs.detect.outputs.supersede != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${REF}" == "refs/heads/main" && ("${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch") ]] || {
            echo "::error::live sync runs only from main on schedule or dispatch"
            exit 1
          }

      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.XS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.XS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: xscaler
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # sync/* branch and merge commit
          permission-workflows: write # the patch set carries workflow files
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Close superseded sync PRs
        if: needs.detect.outputs.supersede != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_NAME: ${{ needs.detect.outputs.head }}
          SUPERSEDE: ${{ needs.detect.outputs.supersede }}
        run: |
          set -euo pipefail
          read -r -a heads <<<"${SUPERSEDE}"
          .github/scripts/xs-sync.sh supersede "${HEAD_NAME:-nothing to sync}" "${heads[@]}"

      - name: Build and open the sync PR
        if: needs.detect.outputs.proceed == 'true' || needs.detect.outputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUMPS: ${{ needs.detect.outputs.bumps }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.upstream_commit }}
          SYNC_HEAD: ${{ needs.detect.outputs.head }}
          DRIFT: ${{ needs.detect.outputs.drift }}
        run: |
          set -euo pipefail
          base_commit="$(git rev-parse origin/main)"
          base_tree="$(git rev-parse "origin/main^{tree}")"
          up_base="$(git merge-base origin/main "${UPSTREAM_COMMIT}")"
          read -r -a bumps <<<"${BUMPS}"
          args=(--branch "${SYNC_HEAD}")
          if [[ "${DRIFT}" == true ]]; then args+=(--upstream-only); fi
          for b in "${bumps[@]}"; do args+=(--bump "${b}"); done
          .github/scripts/xs-sync.sh build --base-commit "${base_commit}" --base-tree "${base_tree}" \
            --upstream-commit "${UPSTREAM_COMMIT}" --upstream-base "${up_base}" "${args[@]}"

  rehearsal:
    name: rehearsal ${{ matrix.kind }}
    needs: plan
    if: needs.plan.outputs.mode == 'rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind: [clean, upstream, merge, conflict, nothing, rebuild, drift]
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.XS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.XS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: xscaler
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # rehearsal-sync/* branch
          permission-workflows: write
          permission-issues: write # conflict issue, labelled rehearsal

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Rehearse
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KIND: ${{ matrix.kind }}
        run: .github/scripts/xs-sync.sh rehearse "${KIND}"

  disable-upstream-workflows:
    name: disable upstream workflows
    needs: [plan, sync]
    # Runs after a failed or skipped sync too: new upstream workflows arrive with every
    # mirrored push, and each one found active is switched off.
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'live' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${REF}" == "refs/heads/main" && ("${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch") ]] || {
            echo "::error::live sync runs only from main on schedule or dispatch"
            exit 1
          }

      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.XS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.XS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: xscaler
          repositories: ${{ github.event.repository.name }}
          permission-actions: write # disable workflows

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # upstream/main and the upstream base commit decide which xs-* workflows are ours
          persist-credentials: false

      - name: Disable every workflow that is not ours
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/xs-sync.sh disable-upstream-workflows

  engines:
    name: rehearsal engine lookup
    needs: plan
    if: needs.plan.outputs.mode == 'rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # engine package lookup and registry login
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install crane and cosign
        run: |
          set -euo pipefail
          .github/scripts/xs-install-tool.sh crane
          .github/scripts/xs-install-tool.sh cosign

      # Read-only, live: the same lookup detect does (Packages API, registry, cosign
      # signature and provenance attestation on the digest). Proves the job token reaches
      # the engine packages; prints what would be bumped.
      - name: Engine lookup and detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          .github/scripts/xs-sync.sh ghcr-login
          .github/scripts/xs-sync.sh engines
          .github/scripts/xs-sync.sh detect --base origin/main

  report:
    name: report failure
    needs: [plan, mirror, detect, sync, disable-upstream-workflows]
    if: failure() && needs.plan.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # failure issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/xs-sync.sh issue-failed "${RUN_URL}"
